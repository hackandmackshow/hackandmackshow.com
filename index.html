  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0c0d11;
      --surface:   #16181f;
      --surface2:  #1e2029;
      --border:    rgba(255,255,255,.06);
      --orange:    #f07a1a;
      --orange-hv: #ff9a42;
      --text:      #eaedf3;
      --muted:     #7b8094;
      --radius:    14px;
    }

    body {
      font-family: 'Inter', -apple-system, "Helvetica Neue", Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      -webkit-font-smoothing: antialiased;
      padding: 40px 20px;
    }

    .glow-bar {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 2px;
      background: linear-gradient(90deg, var(--orange), var(--orange-hv), var(--orange));
      opacity: .8;
      z-index: 10;
    }

    .container {
      max-width: 480px;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 32px;
    }

    .logo {
      width: 120px;
    }

    .tagline {
      color: var(--muted);
      font-size: 15px;
      font-weight: 500;
      text-align: center;
      letter-spacing: .02em;
    }

    .links {
      display: flex;
      flex-direction: column;
      gap: 14px;
      width: 100%;
    }

    .link-btn {
      display: flex;
      align-items: center;
      gap: 14px;
      width: 100%;
      padding: 16px 22px;
      background: rgba(255,255,255,.03);
      border: 1px solid rgba(255,255,255,.05);
      border-radius: var(--radius);
      color: var(--muted);
      text-decoration: none;
      font-size: 15px;
      font-weight: 500;
      transition: all .25s ease;
    }

    .link-btn:hover {
      background: rgba(255,255,255,.06);
      border-color: rgba(255,255,255,.1);
      color: var(--text);
      transform: translateY(-1px);
    }

    .link-btn svg {
      width: 20px;
      height: 20px;
      flex-shrink: 0;
      fill: var(--muted);
      transition: fill .25s ease;
    }

    .link-btn:hover svg {
      fill: var(--orange);
    }

    .link-btn .label {
      flex: 1;
    }

    .link-btn .arrow {
      color: rgba(255,255,255,.15);
      font-size: 16px;
      transition: all .25s ease;
    }

    .link-btn:hover .arrow {
      transform: translateX(3px);
      color: var(--muted);
    }

    footer {
      margin-top: 48px;
      color: var(--muted);
      font-size: 13px;
      text-align: center;
    }
  </style>
</head>
